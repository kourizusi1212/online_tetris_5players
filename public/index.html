<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONLINE TETRIS 5</title><link rel="stylesheet" href="style.css"></head><body>
<div id="lobby" class="screen"><div class="card"><div class="logo">ONLINE <b>TETRIS</b></div><p>最大5人・リアルタイム対戦</p><label>プレイヤー名</label><input id="name" maxlength="16" placeholder="名前"><label>ルームコード</label><input id="room" maxlength="4" inputmode="numeric" placeholder="参加するときだけ入力"><div class="row"><button id="create" class="primary">ルームを作る</button><button id="join">参加する</button></div><div id="status">接続中…</div><section id="roomPanel" class="room hidden"><div class="roomCode" id="code">----</div><button id="copy">コードをコピー</button><div class="count"><span>参加者</span><span id="count">0 / 5</span></div><div id="players"></div><div class="row"><button id="ready">READY</button><button id="start" class="primary hidden">ゲーム開始</button></div><small>ゲーム開始は2人以上でできます。READYは任意です。</small></section></div></div>
<div id="game" class="hidden"><header><b>ONLINE TETRIS 5</b><span id="gameRoom"></span><button id="leave">ロビーへ戻る</button></header><main><aside><div class="panel"><h3>HOLD <small>Q</small></h3><canvas id="hold" width="140" height="90"></canvas></div><div class="panel"><h3>NEXT</h3><canvas id="next" width="140" height="90"></canvas></div><div class="panel stats"><div>SCORE <b id="score">0</b></div><div>LINES <b id="lines">0</b></div><div>LEVEL <b id="level">1</b></div></div><div class="panel controls"><h3>操作</h3><div>← → / A D　移動</div><div>↑ / C　右回転</div><div>Z　左回転</div><div>↓ / S　ソフトドロップ</div><div>W / SPACE　ハードドロップ</div><div>Q　ホールド</div></div></aside><section class="center"><div id="message" class="message hidden"></div><button id="rematch" class="rematch hidden">再戦する</button><canvas id="board" width="300" height="600"></canvas></section><aside class="right"><h3>PLAYERS</h3><div id="versus"></div><p class="tip">脱落後は相手の盤面をクリックして観戦できます。</p></aside></main></div><script src="game.js"></script></body></html>
