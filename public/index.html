<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5人オンラインテトリス</title><link rel="stylesheet" href="style.css"></head><body><main><h1>5人オンラインテトリス</h1><div class="bar"><button id="create">ルーム作成</button><input id="room" maxlength="5" placeholder="ルームコード"><button id="join">参加</button><button id="start">ゲーム開始</button><span id="status">未接続</span></div><div class="grid"><section><div class="info">スコア <b id="score">0</b>　ライン <b id="lines">0</b>　レベル <b id="level">1</b>　部屋 <b id="roomLabel">-</b></div><div class="game"><div><h3>自分</h3><canvas id="board" width="300" height="600"></canvas></div><div><h3>ホールド</h3><canvas id="hold" width="120" height="120"></canvas><h3>次</h3><canvas id="next" width="120" height="120"></canvas></div></div><p>A右 D左 Z左回転 C右回転 Sソフトドロップ W/Spaceハードドロップ Qホールド</p></section><aside><h2>相手の画面</h2><div id="opponents"></div></aside></div></main><script src="game.js"></script></body></html>
